name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release version
        run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run test:site
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/zoomix-*.tgz
          if-no-files-found: error
  release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-package
      - name: Extract browser files from the npm archive
        run: |
          mkdir browser-build
          tar -xzf npm-package/zoomix-*.tgz -C browser-build --strip-components=2 package/browser-build
      - name: Attach package and browser files
        run: gh release upload "$RELEASE_TAG" npm-package/*.tgz browser-build/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish package with npm Trusted Publishing
        run: npm publish ./zoomix-*.tgz --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
