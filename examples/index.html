<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zoomix · Оптическая лаборатория</title><link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any"><link rel="stylesheet" href="../examples/demo.css"><link rel="stylesheet" href="/dist/zoomix.css"><script defer src="../dist/zoomix.min.js"></script></head>
<body><main><header><a class="wordmark" href="../examples/"><img src="/zoomix-logo.svg" alt="Zoomix" width="142" height="36"></a><nav aria-label="Основная навигация"><a href="../docs/">Документация</a><a href="../examples/sliders.html">В галерее ↗</a></nav></header>
<h1>Рассмотреть ближе.</h1><p>Наведите курсор на диафрагму или коснитесь снимка. Выберите, где показывать детали.</p>
<div class="modes" aria-label="Режим увеличения"><button aria-pressed="true" data-mode="inner">В кадре</button><button aria-pressed="false" data-mode="side">Рядом</button><button aria-pressed="false" data-mode="lens">Лупа</button></div>
<section class="workbench"><figure><div data-zoomix="inner"><picture><img src="/optic.svg" alt="Диафрагма объектива 50 мм на координатной сетке"></picture></div><figcaption><b>01 / Оптика</b><span>50 мм · f/1.8</span></figcaption></figure></section>
</main><script type="module">
for (const button of document.querySelectorAll('[data-mode]')) button.onclick = () => {
  const root = document.querySelector('[data-zoomix]');
  new window.Zoomix(root).close();
  root.dataset.zoomix = button.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
};
</script></body></html>
